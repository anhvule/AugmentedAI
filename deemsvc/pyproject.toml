[project]
name = "deemsvc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.4", "jsonschema>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/fixtures/ holds data repos (e.g. pytest_repo/test_sample.py) consumed by
# copying them into a tmp_path and driving them via ToolBroker as a subprocess —
# not real tests. Without this, top-level collection picks them up directly and
# their intentionally-failing/skipped cases show up as permanent suite noise.
norecursedirs = ["fixtures", ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv", ".venv"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
